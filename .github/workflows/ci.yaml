# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # pnpm 11 needs Node >=22.13; Node 20 covered by the separate node20-smoke job
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # cache ~/.npm so the npx tests in test/dist-ext.test.ts don't refetch transitive deps each run
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: export NODE env var (required by tests)
        shell: bash
        run: echo "NODE=${{ steps.setup-node.outputs.node-path }}" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test:all

      - if: runner.os != 'Windows'
        run: pnpm run style

  # smoke test: package supports Node >=20 at runtime, even though pnpm-based dev requires Node >=22.13
  node20-smoke:
    name: node20-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      # use a newer Node to pack with pnpm (need pnpm 11), then switch to Node 20 for the consumer-side install/run
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:dev
      - run: pnpm pack --out ${{ runner.temp }}/pack.tgz

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: install and run the pack with Node 20 + npm
        shell: bash
        env:
          GRAMMAR: ${{ github.workspace }}/test/fixtures/grammar.json
        run: |
          DIR="${RUNNER_TEMP}/node20-consumer"
          mkdir -p "$DIR" && cd "$DIR"
          echo '{"name":"node20-smoke","private":true}' > package.json
          npm install "${RUNNER_TEMP}/pack.tgz"
          npx textmate-validate "$GRAMMAR"
